server:
  # Render/Heroku e similares injetam a porta via PORT; localmente usa 8080
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: aguiaradar-backend
  profiles:
    # dev (padrao) | staging | prod  -> definido por ambiente via SPRING_PROFILES_ACTIVE
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguiaradar}

# Configuracoes customizadas do AguiaRadar
aguiaradar:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1hZ3VpYS1yYWRhci1kZXNhZmlvLWZpYXAtMjAyNi1jaGF2ZS1zZWd1cmE=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  ia:
    # Provedor gratuito de IA usado para pontuar/priorizar ideias.
    # Compativel com a API da OpenRouter (https://openrouter.ai) - varios modelos gratuitos disponiveis.
    provider-url: ${IA_PROVIDER_URL:https://openrouter.ai/api/v1/chat/completions}
    api-key: ${IA_API_KEY:}
    model: ${IA_MODEL:meta-llama/llama-3.1-8b-instruct:free}
    enabled: ${IA_ENABLED:true}
  seed:
    enabled: ${SEED_ENABLED:true}

# ---------- Observabilidade (usado pelo pipeline para validar cada deploy) ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness e /readiness
  info:
    env:
      enabled: true

# Exposto em GET /actuator/info -> mostra em qual ambiente e qual versao esta rodando
info:
  app:
    name: AguiaRadar Backend
    description: Plataforma de inovacao e ESG - Cidades ESG Inteligentes
    environment: ${APP_ENV:local}
    version: ${APP_VERSION:dev}

logging:
  level:
    br.com.fiap.aguiaradar: INFO
    org.springframework.security: WARN
